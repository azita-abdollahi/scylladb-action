name: ScyllaDB Action Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  SCYLLA_USERNAME: admin
  SCYLLA_PASSWORD: admin
  SCYLLA_PORT: 9042
  SCYLLA_KEYSPACE: test
  SCYLLA_DATACENTER: datacenter1   

jobs:
  test-on-runner:
    name: Tests on the runner (localhost)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 26.x]
    env:
      SCYLLA_HOSTNAME: localhost
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Start ScyllaDB
        uses: ./
        with:
          host: localhost

      - run: npm install
      - run: npm run test

  test-in-container:
    name: Tests inside a container job (shared docker network)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 26.x]
    container:
      image: docker://ubuntu:24.04
    env:
      SCYLLA_HOSTNAME: scylla
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libatomic1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/checkout@v7

      - name: Start ScyllaDB
        uses: ./
        with:
          network: ${{ job.container.network }}
          host: scylla

      - run: npm install
      - run: npm run test